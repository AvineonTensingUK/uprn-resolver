[project]
name = "uprn-resolver"
version = "0.1.0"
description = "Open (OGL-only) UPRN -> point, TOID, approximate building outline dataset for GB"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "shapely>=2.0",
    "requests>=2.32",
    "pyproj>=3.7.2",
]

[dependency-groups]
dev = [
    "geopandas>=1.2.0",
    "jsonschema>=4.26.0",
    "pystac>=1.15.2",
    "pytest>=8",
    "ruff>=0.17.2",
]

[project.scripts]
uprn-resolver = "uprn_resolver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
